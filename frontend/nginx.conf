server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API so the browser needs no CORS and the app can use relative paths.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;   # hybrid+ce over a whole programme is slow on CPU
        proxy_send_timeout 180s;
    }
}
